name: Update contribution snake

on:
  push:
    branches: [main]
    paths: [.github/workflows/contribution-snake.yml]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish the animations
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: snake-output
          build_dir: dist
          keep_history: true
          allow_empty_commit: false
          commit_message: "chore: update contribution snake"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
        env:
          GITHUB_TOKEN: ${{ github.token }}
